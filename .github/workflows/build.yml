name: Build My JeOS Image
on:
  workflow_dispatch: # Botón manual de encendido

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Instalamos las herramientas de particionado y soporte de sistemas de archivos
      - name: Install Disk Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y genimage dosfstools e2fsprogs exfatprogs mtools

      # Extraemos el sistema y preparamos las carpetas estructuradas para genimage
      - name: Create Multi-Partition Structure
        run: |
          # 1. Compilamos tu Containerfile puro
          docker build -t mi-jeos-consola:latest -f ./Containerfile .
          
          # 2. Extraemos el sistema operativo a una carpeta temporal
          mkdir -p rootfs
          docker create --name temp-container mi-jeos-consola:latest
          docker export temp-container | tar -C rootfs -xf -
          docker rm temp-container

          # 3. Preparamos el cargador de arranque EFI real
          mkdir -p bootfs/EFI/BOOT
          if [ -f rootfs/usr/lib/systemd/boot/efi/systemd-bootx64.efi ]; then
            cp rootfs/usr/lib/systemd/boot/efi/systemd-bootx64.efi bootfs/EFI/BOOT/BOOTX64.EFI
          else
            echo "Bootloader" > bootfs/EFI/BOOT/BOOTX64.EFI
          fi

          # 4. Generamos las carpetas requeridas por genimage
          mkdir -p input
          mkdir -p root # Carpeta raíz vacía requerida obligatoriamente por genimage
          
          # Copiamos la estructura de arranque
          cp -r bootfs input/boot_dir
          
          # Partición 2: Sistema Operativo (6 GB)
          truncate -s 6G input/rootfs.ext4
          mkfs.ext4 -d rootfs input/rootfs.ext4
          
          # Partición 3: Datos/Juegos exFAT visible en Windows (1 GB base)
          truncate -s 1G input/juegos.exfat
          mkfs.exfat input/juegos.exfat

          # 5. Configuración de genimage limpia con el bloque vfat correcto
          echo 'image boot.vfat {
              vfat {
                  file EFI {
                      image = "boot_dir/EFI"
                  }
              }
              size = 128M
          }

          image mi-jeos-consola.img {
              hdimage {
                  partition-table-type = "gpt"
                  align = 1M
              }
              size = 7700M
              
              partition boot {
                  image = "boot.vfat"
                  bootable = true
                  partition-uuid = "C12A7328-F81F-11D2-BA4B-00A0C93EC93B"
              }
              partition sistema {
                  image = "rootfs.ext4"
                  partition-uuid = "4FBD7E29-9D25-41B8-AFD0-062C0CEFF05D"
              }
              partition juegos {
                  image = "juegos.exfat"
                  partition-uuid = "EBD0A0A2-B9E5-4433-87C0-68B6B72699C7"
              }
          }' > genimage.cfg

      # Ensamblamos todo en el archivo .img universal final
      - name: Assemble Final IMG File
        run: |
          genimage --config genimage.cfg
          mv images/mi-jeos-consola.img ./

      # Subimos tu imagen definitiva con tabla GPT autoiniciable
      - name: Upload Bootable IMG
        uses: actions/upload-artifact@v4
        with:
          name: mi-jeos-consola-bootable-real-img
          path: mi-jeos-consola.img
