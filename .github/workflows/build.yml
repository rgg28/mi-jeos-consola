name: Build My JeOS Image
on:
  workflow_dispatch: # Botón manual de encendido

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Instalamos las herramientas de particionado y soporte exFAT
      - name: Install Disk Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y genimage dosfstools e2fsprogs exfatprogs

      # Extraemos el sistema y preparamos la receta con auto-expansión
      - name: Create Multi-Partition Structure
        run: |
          # 1. Compilamos tu Containerfile puro
          docker build -t mi-jeos-consola:latest -f ./Containerfile .
          
          # 2. Extraemos el sistema operativo a una carpeta temporal
          mkdir -p rootfs
          docker create --name temp-container mi-jeos-consola:latest
          docker export temp-container | tar -C rootfs -xf -
          docker rm temp-container

          # 3. Creamos la estructura de carpetas para genimage
          mkdir -p input
          mkdir -p juegos_dir
          
          # 4. Generamos los archivos base mínimos
          truncate -s 6G input/rootfs.ext4
          mkfs.ext4 -d rootfs input/rootfs.ext4
          
          # La partición de juegos se crea con un tamaño mínimo inicial
          truncate -s 100M input/juegos.exfat
          mkfs.exfat input/juegos.exfat

          # 5. Modificamos la receta agregando la regla de AUTO-RESIZE
          echo 'image mi-jeos-consola.img {
              hdimage {
                  align = 1M
              }
              partition sistema {
                  partition-type = 0x83
                  image = "rootfs.ext4"
                  size = 6G
              }
              partition juegos {
                  partition-type = 0x07
                  image = "juegos.exfat"
                  autoresize = true # El secreto: Se expande al 100% de cualquier USB al arrancar
              }
          }' > genimage.cfg

      # Ensamblamos todo en el archivo .img universal definitivo
      - name: Assemble Final IMG File
        run: |
          genimage --config genimage.cfg
          mv images/mi-jeos-consola.img ./

      # Subimos tu imagen auto-expansible lista para usar
      - name: Upload Bootable IMG
        uses: actions/upload-artifact@v4
        with:
          name: mi-jeos-consola-auto-expansible-img
          path: mi-jeos-consola.img
