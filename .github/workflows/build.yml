name: Build My JeOS Image (Direct Rootfs)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Paso crucial para evitar el error "No space left on device"
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf /usr/shadowbi

      - name: Install Build Tools
        run: |
          sudo apt-get update
          # CORRECCIÓN: Se añade pacman-package-manager para que pacstrap tenga pacman y pacman-key disponibles
          sudo apt-get install -y genimage dosfstools e2fsprogs exfatprogs mtools arch-install-scripts pacman-package-manager

      # Reemplazo de arch-bootstrap.sh por la herramienta nativa pacstrap
      - name: Bootstrap Arch Linux System
        run: |
          mkdir -p rootfs
          sudo mkdir -p rootfs/etc/pacman.d
          echo "Server = https://pkgbuild.com\$repo/os/\$arch" | sudo tee rootfs/etc/pacman.d/mirrorlist
          sudo pacstrap -K rootfs base

      - name: Configure and Install Packages
        run: |
          sudo mount --bind /dev rootfs/dev
          sudo mount --bind /proc rootfs/proc
          sudo mount --bind /sys rootfs/sys
          
          # PREVENCIÓN DE ERROR: Copia los DNS del runner para que el chroot tenga acceso a internet
          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf
          
          sudo sed -i -e '/^#\[multilib\]/s/^#//' -e '/^\[multilib\]/{n;s/^#//}' rootfs/etc/pacman.conf
          
          sudo chroot rootfs /bin/bash -c "
            pacman-key --init && pacman-key --populate archlinux
            pacman -Syu --noconfirm
            pacman -S --noconfirm gnu-free-fonts glibc glibc-locales linux linux-firmware mkinitcpio parted mesa lib32-mesa vulkan-radeon vulkan-swrast nvidia-utils libvdpau libva-utils pciutils steam gamescope retroarch bluez bluez-utils networkmanager seatd xorg-server xorg-xinit xorg-xrandr xf86-video-amdgpu exfatprogs ntfs-3g fuse2 sudo pipewire pipewire-alsa pipewire-pulse pipewire-jack wireplumber mangohud lib32-mangohud gamemode lib32-gamemode dbus polkit
            systemctl enable NetworkManager bluetooth seatd dbus
          "

          sudo chroot rootfs /bin/bash -c "
            echo 'es_AR.UTF-8 UTF-8' > /etc/locale.gen && locale-gen
            echo 'LANG=es_AR.UTF-8' > /etc/locale.conf
            ln -sf /usr/share/zoneinfo/America/Argentina/Tucuman /etc/localtime
            echo 'root:root' | chpasswd
            useradd -m -g users -G wheel,video,input,seat -s /bin/bash consola && passwd -d consola
            echo '%wheel ALL=(ALL:ALL) NOPASSWD: ALL' >> /etc/sudoers
            setcap 'cap_sys_nice+ep' /usr/bin/gamescope
          "

          sudo mkdir -p rootfs/etc/systemd/system/getty@tty1.service.d/
          echo -e "[Service]\nExecStart=\nExecStart=-/sbin/agetty --autologin consola --noclear %I \$TERM" | sudo tee rootfs/etc/systemd/system/getty@tty1.service.d/override.conf > /dev/null

          sudo mkdir -p rootfs/home/consola/juegos rootfs/home/consola/discos_windows
          sudo chown -R 1000:100 rootfs/home/consola/juegos rootfs/home/consola/discos_windows
          sudo sed -i 's/^MODULES=()/MODULES=(amdgpu i915)/' rootfs/etc/mkinitcpio.conf
          sudo chroot rootfs /bin/bash -c "mkinitcpio -P"
          sudo umount -R rootfs/dev rootfs/proc rootfs/sys

      - name: Inject Custom Scripts and Bootloader
        run: |
          sudo cp arrancar_steam.sh rootfs/home/consola/arrancar_steam.sh
          sudo chmod +x rootfs/home/consola/arrancar_steam.sh
          sudo chown 1000:100 rootfs/home/consola/arrancar_steam.sh

          sudo cp .bash_profile rootfs/home/consola/.bash_profile
          sudo chown 1000:100 rootfs/home/consola/.bash_profile

          sudo mkdir -p rootfs/etc/udev/rules.d/
          sudo tee rootfs/etc/udev/rules.d/70-steam-input.rules > /dev/null << 'EOF'
          KERNEL=="uinput", MODE="0660", OPTIONS+="static_node=uinput"
          KERNEL=="js*", MODE="0664"
          SUBSYSTEM=="usb", ATTRS{idVendor}=="054c", ATTRS{idProduct}=="05c4", MODE="0666"
          SUBSYSTEM=="usb", ATTRS{idVendor}=="054c", ATTRS{idProduct}=="09cc", MODE="0666"
          SUBSYSTEM=="usb", ATTRS{idVendor}=="054c", ATTRS{idProduct}=="0ce6", MODE="0666"
          SUBSYSTEM=="usb", ATTRS{idVendor}=="057e", ATTRS{idProduct}=="2009", MODE="0666"
          EOF

          sudo mkdir -p bootfs/EFI/BOOT bootfs/loader/entries
          sudo cp rootfs/usr/lib/systemd/boot/efi/systemd-bootx64.efi bootfs/EFI/BOOT/BOOTX64.EFI
          echo -e "default arch.conf\ntimeout 2" | sudo tee bootfs/loader/loader.conf > /dev/null
          echo -e "title Arch_JeOS_Universal\nlinux /vmlinuz-linux\ninitrd /initramfs-linux.img\noptions root=PARTUUID=4fbd7e29-9d25-41b8-afd0-062c0ceff05d rw quiet rootdelay=5" | sudo tee bootfs/loader/entries/arch.conf > /dev/null
          sudo cp rootfs/boot/vmlinuz-linux bootfs/
          sudo cp rootfs/boot/initramfs-linux.img bootfs/
          sudo chroot rootfs /bin/bash -c "pacman -Scc --noconfirm"

      - name: Assemble Final IMG File
        run: |
          mkdir -p input images
          sudo cp -r bootfs input/boot_dir
          truncate -s 6G input/rootfs.ext4
          sudo mkfs.ext4 -F -O ^metadata_csum -d rootfs input/rootfs.ext4
          truncate -s 256M input/juegos.exfat
          mkfs.exfat input/juegos.exfat

          cat << 'EOF' > genimage.cfg
          image boot.vfat {
              vfat {
                  file EFI { image = "boot_dir/EFI" }
                  file loader { image = "boot_dir/loader" }
                  file vmlinuz-linux { image = "boot_dir/vmlinuz-linux" }
                  file initramfs-linux.img { image = "boot_dir/initramfs-linux.img" }
              }
              size = 128M
          }
          image mi-jeos-consola.img {
              hdimage { partition-table-type = "gpt" ; align = 1M }
              size = 6500M
              partition boot { image = "boot.vfat" ; bootable = true ; partition-uuid = "c12a7328-f81f-11d2-ba4b-00a0c93ec93b" }
              partition sistema { image = "rootfs.ext4" ; partition-uuid = "4fbd7e29-9d25-41b8-afd0-062c0ceff05d" }
              partition juegos { image = "juegos.exfat" ; partition-uuid = "ebd0a0a2-b9e5-4433-87c0-68b6b72699c7" }
          }
          EOF

          sudo genimage --config genimage.cfg --inputpath input --outputpath images
          sudo mv images/mi-jeos-consola.img ./
          sudo chmod 777 mi-jeos-consola.img

      - name: Upload Bootable IMG
        uses: actions/upload-artifact@v4
        with:
          name: mi-jeos-consola-direct-img
          path: mi-jeos-consola.img
