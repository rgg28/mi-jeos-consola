name: Build My JeOS Image
on:
  workflow_dispatch: # Botón manual de encendido

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Instalamos las herramientas de particionado y soporte de sistemas de archivos
      - name: Install Disk Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y genimage dosfstools e2fsprogs exfatprogs mtools

      # Extraemos el sistema y preparamos las carpetas estructuradas para genimage
      - name: Create Multi-Partition Structure
        run: |
          # 1. Compilamos tu Containerfile puro
          docker build -t mi-jeos-consola:latest -f ./Containerfile .
          
          # 2. Extraemos el sistema operativo a una carpeta temporal con permisos root
          mkdir -p rootfs
          docker create --name temp-container mi-jeos-consola:latest
          sudo docker export temp-container | sudo tar -C rootfs -xf -
          docker rm temp-container

          # =========================================================================
          # GENERACIÓN DEL ENTORNO DE ARRANQUE REAL (Solución Kernel ausente)
          # =========================================================================
          sudo mount --bind /dev rootfs/dev
          sudo mount --bind /proc rootfs/proc
          sudo mount --bind /sys rootfs/sys
          
          # Se genera la ramdisk de arranque real dentro del chroot
          sudo chroot rootfs /bin/bash -c "mkinitcpio -P"
          
          sudo umount -R rootfs/dev rootfs/proc rootfs/sys
          # =========================================================================

          # CORRECCIÓN DE PUNTOS DE MONTAJE: Carpetas base para el auto-montaje dinámico de Windows
          sudo mkdir -p rootfs/home/consola/juegos
          sudo mkdir -p rootfs/home/consola/discos_windows/disco_C
          sudo mkdir -p rootfs/home/consola/discos_windows/disco_D
          sudo mkdir -p rootfs/home/consola/discos_windows/disco_E
          
          sudo sed -i '/juegos/d' rootfs/etc/fstab || true
          
          # Partición interna exFAT del propio pendrive permanente
          echo "PARTUUID=ebd0a0a2-b9e5-4433-87c0-68b6b72699c7 /home/consola/juegos exfat defaults,noatime,uid=1000,gid=985,nofail 0 0" | sudo tee -a rootfs/etc/fstab > /dev/null
          
          # Asignamos permisos completos de usuario a las carpetas creadas (UID 1000, GID 100 de users)
          sudo chown -R 1000:100 rootfs/home/consola/juegos rootfs/home/consola/discos_windows

          # 3. Preparamos el cargador de arranque EFI real y el menú de inicio obligatorio
          sudo mkdir -p bootfs/EFI/BOOT
          sudo mkdir -p bootfs/loader/entries
          
          # Copiamos el binario de arranque integrado en Arch
          if [ -f rootfs/usr/lib/systemd/boot/efi/systemd-bootx64.efi ]; then
            sudo cp rootfs/usr/lib/systemd/boot/efi/systemd-bootx64.efi bootfs/EFI/BOOT/BOOTX64.EFI
          else
            echo "Bootloader" | sudo tee bootfs/EFI/BOOT/BOOTX64.EFI > /dev/null
          fi

          echo -e "default arch.conf\ntimeout 2" | sudo tee bootfs/loader/loader.conf > /dev/null
          
          # NOTA: Parámetros unificados en minúsculas y rootdelay=5 para compatibilidad USB externa
          echo -e "title Arch_JeOS_Universal\nlinux /vmlinuz-linux\ninitrd /initramfs-linux.img\noptions root=PARTUUID=4fbd7e29-9d25-41b8-afd0-062c0ceff05d rw quiet rootdelay=5" | sudo tee bootfs/loader/entries/arch.conf > /dev/null

          # Copiamos el Kernel y la ramdisk (Que ahora sí existen gracias al chroot previo)
          sudo cp rootfs/boot/vmlinuz-linux bootfs/
          sudo cp rootfs/boot/initramfs-linux.img bootfs/

          # 4. Generamos las carpetas requeridas por genimage
          mkdir -p input
          mkdir -p root
          
          sudo cp -r bootfs input/boot_dir
          
          # CORRECCIÓN DE SEGURIDAD EXCLUSIVA: Evitamos incompatibilidades de mkfs en hosts Ubuntu
          truncate -s 6G input/rootfs.ext4
          sudo mkfs.ext4 -F -O ^metadata_csum -d rootfs input/rootfs.ext4
          
          # Partición 3: Inicialización de bloque base para la partición de Juegos exFAT
          truncate -s 256M input/juegos.exfat
          mkfs.exfat input/juegos.exfat

          # 5. Configuración de genimage utilizando delimitadores limpios respetando el tabulado de YAML
          sudo bash -c "cat << 'EOF' > genimage.cfg
          image boot.vfat {
              vfat {
                  file EFI {
                      image = \"boot_dir/EFI\"
                  }
                  file loader {
                      image = \"boot_dir/loader\"
                  }
                  file vmlinuz-linux {
                      image = \"boot_dir/vmlinuz-linux\"
                  }
                  file initramfs-linux.img {
                      image = \"boot_dir/initramfs-linux.img\"
                  }
              }
              size = 128M
          }

          image mi-jeos-consola.img {
              hdimage {
                  partition-table-type = \"gpt\"
                  align = 1M
              }
              size = 6500M
              
              partition boot {
                  image = \"boot.vfat\"
                  bootable = true
                  partition-uuid = \"c12a7328-f81f-11d2-ba4b-00a0c93ec93b\"
              }
              partition sistema {
                  image = \"rootfs.ext4\"
                  partition-uuid = \"4fbd7e29-9d25-41b8-afd0-062c0ceff05d\"
              }
              partition juegos {
                  image = \"juegos.exfat\"
                  partition-uuid = \"ebd0a0a2-b9e5-4433-87c0-68b6b72699c7\"
              }
          }
          EOF"

          # Limpiamos los espacios en blanco iniciales que metió la indentación de YAML en el archivo final
          sudo sed -i 's/^[[:space:]]\{10\}//' genimage.cfg

      # Ensamblamos todo con genimage
      - name: Assemble Final IMG File
        run: |
          mkdir -p images
          sudo genimage --config genimage.cfg --inputpath input --outputpath images
          sudo mv images/mi-jeos-consola.img ./
          sudo chmod 777 mi-jeos-consola.img

      # Subimos la imagen definitiva armada
      - name: Upload Bootable IMG
        uses: actions/upload-artifact@v4
        with:
          name: mi-jeos-consola-bootable-real-img
          path: mi-jeos-consola.img
