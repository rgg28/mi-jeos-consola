name: Build My JeOS Image
on:
  workflow_dispatch: # Botón manual de encendido

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Instalamos las herramientas nativas de Arch Linux en el servidor de GitHub
      - name: Install Archiso Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y arch-testtrack squashfs-tools xorriso copy-installer-data || true
          docker run --privileged --rm -v /:/host archlinux:latest pacman -Syu --noconfirm archiso

      # Construimos la estructura del disco duro bootable
      - name: Generate Bootable Disk Image
        run: |
          mkdir -p src/profile
          cp -r /usr/share/archiso/configs/releng/* src/profile/ || true
          
          # Inyectamos tu receta limpia y el script multilib
          echo -e "\n[multilib]\nInclude = /etc/pacman.d/mirrorlist" >> src/profile/pacman.conf
          echo -e "mesa\nlib32-mesa\nvulkan-radeon\nnvidia-utils\nlib32-nvidia-utils\nsteam\ngamescope\nretroarch\nbluez\nxorg-server\nxf86-video-amdgpu" >> src/profile/packages.x86_64
          
          # Compilamos el instalador .ISO puro
          mkarchiso -v -w /tmp/archiso-workspace -o ./output src/profile/

      # Subimos tu archivo .ISO listo para flashear en cualquier PC
      - name: Upload Bootable Image
        uses: actions/upload-artifact@v4
        with:
          name: mi-jeos-consola-bootable
          path: output/*.iso
