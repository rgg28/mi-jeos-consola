name: Build My JeOS Image
on:
  workflow_dispatch: # Activar manualmente con el botón

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Maximizamos el espacio del servidor porque las imágenes de Linux son pesadas
      - name: Maximize Build Space
        uses: ublue-os/remove-unwanted-software@main

      # Construimos el JeOS adaptando los parámetros del sistema inmutable
      - name: Build Image using Buildah
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: mi-jeos-consola
          tags: latest
          containerfiles: |
            ./Containerfile
          oci: true
          extra-args: |
            --isolation=chroot

      # Generamos el instalador .ISO final y limpio para tu USB
      - name: Build Bootable ISO
        uses: ublue-os/isogenerator@main
        with:
          image-name: mi-jeos-consola
          installer-repo: fedora
          installer-major-version: 40
