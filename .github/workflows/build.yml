name: Build My JeOS Image
on:
  workflow_dispatch: # Botón manual de encendido

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Usamos el motor nativo de Docker para compilar tu Containerfile limpio
      - name: Build Image with Docker
        run: |
          docker build -t mi-jeos-consola:latest -f ./Containerfile .

      # Exportamos el sistema de forma directa a un archivo comprimido
      - name: Export Image File
        run: |
          docker save -o mi-jeos-consola.tar mi-jeos-consola:latest
          gzip mi-jeos-consola.tar

      # Guardamos tu archivo final listo para descargar
      - name: Upload JeOS System Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mi-jeos-consola-sistema
          path: mi-jeos-consola.tar.gz
