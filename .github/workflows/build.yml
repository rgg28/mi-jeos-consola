name: Build My JeOS Image
on:
  workflow_dispatch: # Botón manual de encendido

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Compilamos la imagen limpia con Docker
      - name: Build Clean System
        run: |
          docker build -t mi-jeos-consola:latest -f ./Containerfile .

      # Guardamos el sistema en un archivo directo listo para BalenaEtcher
      - name: Export File
        run: |
          docker save -o mi-jeos-consola.tar mi-jeos-consola:latest
          gzip mi-jeos-consola.tar

      # Subimos tu sistema final para descargarlo con un clic
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mi-jeos-consola-sistema
          path: mi-jeos-consola.tar.gz
