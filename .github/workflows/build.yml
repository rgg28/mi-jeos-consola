name: Build My JeOS Image
on:
  workflow_dispatch: # Botón manual de encendido

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Instalamos las herramientas de particionado y soporte exFAT para Windows
      - name: Install Disk Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y genimage dosfstools e2fsprogs exfatprogs

      # Extraemos el sistema limpio y preparamos las dos particiones
      - name: Create Multi-Partition Structure
        run: |
          # 1. Compilamos tu Containerfile puro
          docker build -t mi-jeos-consola:latest -f ./Containerfile .
          
          # 2. Extraemos el sistema operativo a una carpeta temporal
          mkdir -p rootfs
          docker create --name temp-container mi-jeos-consola:latest
          docker export temp-container | tar -C rootfs -xf -
          docker rm temp-container

          # 3. Creamos una carpeta vacía para la partición de juegos exFAT
          mkdir -p juegos_dir
          
          # 4. Generamos los archivos de sistema virtuales individuales
          # Partición 1: Sistema Operativo (2 GB)
          truncate -s 2G rootfs.ext4
          mkfs.ext4 -d rootfs rootfs.ext4
          
          # Partición 2: Datos/Juegos exFAT visible en Windows (1 GB base expansible)
          truncate -s 1G juegos.exfat
          mkfs.exfat juegos.exfat

          # 5. Configuramos la receta de particiones para el archivo .img final
          echo 'image mi-jeos-consola.img {
              hdimage {}
              partition sistema {
                  partition-type = 0x83
                  image = "rootfs.ext4"
                  size = 2G
              }
              partition juegos {
                  partition-type = 0x07
                  image = "juegos.exfat"
                  size = 1G
              }
          }' > genimage.cfg

      # Ensamblamos todo en el archivo .img universal final
      - name: Assemble Final IMG File
        run: |
          genimage --config genimage.cfg
          mv images/mi-jeos-consola.img ./

      # Subimos tu imagen de doble partición lista para usar
      - name: Upload Bootable IMG
        uses: actions/upload-artifact@v4
        with:
          name: mi-jeos-consola-doble-particion-img
          path: mi-jeos-consola.img
